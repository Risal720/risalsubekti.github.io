<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Risal Subekti - Galaxy Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Press Start 2P", monospace;
        background-color: #050515;
        color: #a5b4fc;
        overflow: hidden;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      canvas {
        display: block;
        background: #03030c;
        width: 100vw;
        height: 100vh;
      }
      .pixel-border {
        box-shadow:
          0 0 0 3px #0f172a,
          0 0 0 6px #6366f1,
          0 0 15px rgba(99, 102, 241, 0.4);
      }
      .pixel-border-red {
        box-shadow:
          0 0 0 3px #180505,
          0 0 0 6px #ef4444,
          0 0 15px rgba(239, 68, 68, 0.4);
      }
      .retro-btn {
        transition:
          transform 0.1s ease,
          background-color 0.1s ease;
      }
      .retro-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body
    class="w-screen h-screen flex flex-col justify-between relative overflow-hidden"
  >
    <!-- Canvas Game Arcade Portfolio -->
    <canvas
      id="galaxyCanvas"
      class="absolute inset-0 z-0 w-full h-full cursor-crosshair"
    ></canvas>

    <!-- UI Modal Informasi Planet Responsif Mobile -->
    <div
      id="planetModal"
      class="hidden absolute top-16 md:top-24 left-2 right-2 md:left-12 z-20 mx-auto w-[96%] md:w-full max-w-lg bg-slate-950/95 border-3 md:border-4 border-red-500 p-4 md:p-8 pixel-border-red flex flex-col gap-3 md:gap-4 text-red-400 shadow-2xl max-h-[75vh] md:max-h-[85vh] overflow-y-auto"
    >
      <div
        id="modalHeaderContent"
        class="flex items-center justify-between gap-2"
      >
        <div class="flex items-center gap-3">
          <!-- Bingkai Foto Kostum Astronot khusus untuk ABOUT -->
          <div
            id="astronautAvatarContainer"
            class="hidden flex-shrink-0 w-16 h-20 md:w-24 md:h-28 relative border-2 border-indigo-400 bg-indigo-950 flex flex-col items-center justify-center pixel-border shadow-inner ring-2 md:ring-4 ring-yellow-400 animate-pulse"
            title="-> Masukkan link foto Anda di tag <img> di bawah ini <-"
          >
            <!-- Helm Kaca (Visor) Astronot tempat wajah -->
            <div
              class="w-11 h-14 md:w-16 md:h-18 bg-sky-200/90 rounded-full border-2 border-slate-300 overflow-hidden relative flex items-center justify-center shadow-md"
            >
              <!-- ================================================================= -->
              <!-- TEMPAT MEMASUKKAN FOTO ANDA:                                      -->
              <!-- Ganti atau masukkan tag <img> di bawah ini. Contoh:                -->
              <!-- <img src="URL_FOTO_ANDA.jpg" class="w-full h-full object-cover">   -->
              <!-- ================================================================= -->
              <!-- Placeholder SVG Wajah Profesional / Siluet Wajah -->
              <svg
                class="w-8 h-8 md:w-12 md:h-12 text-slate-700 absolute bottom-0"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 2C9.24 2 7 4.24 7 7c0 2.21 1.43 4.08 3.41 4.74C8.75 12.63 7.5 14.56 7.5 17.5V20h9v-2.5c0-2.94-1.25-4.87-2.91-5.76C15.57 11.08 17 9.21 17 7c0-2.76-2.24-5-5-5zm0 2c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3zm0 9c2.67 0 8 1.34 8 4v2H4v-2c0-2.66 5.33-4 8-4z"
                />
              </svg>
              <!-- Efek pantulan kaca helm astronot -->
              <div
                class="absolute top-1 left-2 w-3 h-1.5 bg-white/60 rounded-full transform -rotate-45"
              ></div>
            </div>
            <!-- Kerah Baju Kostum Astronot -->
            <div
              class="w-14 h-4 md:w-20 md:h-5 bg-slate-200 border-t-2 border-slate-400 absolute bottom-0 rounded-t-lg flex justify-center items-center"
            >
              <div class="w-2 h-1.5 md:w-3 md:h-2 bg-red-600 rounded-sm"></div>
            </div>
          </div>
          <h2
            id="modalTitle"
            class="text-sm md:text-2xl font-bold tracking-wider text-red-400 pt-1"
          >
            PLANET: ABOUT
          </h2>
        </div>
        <!-- Tombol Launch dipindah ke kanan atas header modal -->
        <button
          id="launchBtn"
          onclick="launchShip()"
          class="retro-btn bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-3 text-[9px] md:text-xs tracking-wider uppercase border-2 border-red-300 text-center shadow-lg cursor-pointer whitespace-nowrap"
        >
          TAKE OFF
        </button>
      </div>
      <div
        class="w-full border-b-2 border-dashed border-red-500/50 my-0.5"
      ></div>
      <p
        id="modalDesc"
        class="text-xs md:text-base leading-relaxed text-slate-100 font-sans max-h-48 md:max-h-60 overflow-y-auto pr-2"
      >
        Deskripsi planet akan muncul di sini...
      </p>
    </div>

    <!-- HUD Petunjuk Atas -->
    <div
      class="relative z-10 p-2 md:p-4 flex flex-col sm:flex-row justify-between items-center pointer-events-none gap-2"
    >
      <div
        class="bg-slate-900/90 border-2 border-indigo-500 px-3 py-1.5 text-[8px] md:text-xs text-indigo-300 pixel-border pointer-events-auto flex items-center gap-2"
      >
        <span class="truncate max-w-[200px] sm:max-w-none"
          >PILOT: RISAL | GALAXY v2.8</span
        >
        <button
          id="musicToggleBtn"
          onclick="toggleMusic()"
          class="retro-btn bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 text-[7px] md:text-[8px] border border-indigo-300 cursor-pointer"
        >
          🎵 MUSIC: ON
        </button>
      </div>
      <div
        id="instructionHud"
        class="bg-indigo-950/90 border-2 border-indigo-400 px-3 py-1.5 text-[8px] md:text-xs text-indigo-200 animate-pulse text-center"
      >
        Gunakan WASD / Panah / [SPASI] untuk Mendarat
      </div>
    </div>

    <!-- Mobile D-Pad & Tombol Land di Layar (Responsif) -->
    <div
      class="relative z-10 p-3 md:p-4 flex justify-between items-end pointer-events-auto pb-safe"
    >
      <!-- D-Pad Kiri -->
      <div
        class="grid grid-cols-3 gap-1 w-28 h-28 md:w-32 md:h-32 opacity-90 md:opacity-50 hover:opacity-100 transition-opacity"
      >
        <div></div>
        <button
          id="btnUp"
          class="bg-indigo-900/90 border border-indigo-400 text-white font-bold text-xs flex items-center justify-center active:bg-indigo-700 rounded shadow"
        >
          W
        </button>
        <div></div>
        <button
          id="btnLeft"
          class="bg-indigo-900/90 border border-indigo-400 text-white font-bold text-xs flex items-center justify-center active:bg-indigo-700 rounded shadow"
        >
          A
        </button>
        <button
          id="btnDown"
          class="bg-indigo-900/90 border border-indigo-400 text-white font-bold text-xs flex items-center justify-center active:bg-indigo-700 rounded shadow"
        >
          S
        </button>
        <button
          id="btnRight"
          class="bg-indigo-900/90 border border-indigo-400 text-white font-bold text-xs flex items-center justify-center active:bg-indigo-700 rounded shadow"
        >
          D
        </button>
      </div>

      <!-- Tombol Land Kanan -->
      <button
        id="btnLand"
        class="retro-btn bg-red-600 hover:bg-red-500 text-white font-bold w-16 h-16 md:w-20 md:h-20 rounded-full border-3 md:border-4 border-red-300 flex items-center justify-center text-[10px] md:text-xs shadow-lg uppercase tracking-wider"
      >
        LAND
      </button>
    </div>

    <script>
      // ==========================================
      // WEB AUDIO API - SYNTHESIZER RETRO MUSIC (AUTO-PLAY & LOOPING)
      // ==========================================
      let audioCtx = null
      let isMusicPlaying = false
      let musicInterval = null

      function startSpaceSynthLoop() {
        if (musicInterval) clearInterval(musicInterval)

        const bassNotes = [110, 92.5, 73.42, 82.41] // A2, F#2, D2, E2
        const melodyNotes = [440, 554.37, 659.25, 880, 783.99, 659.25]
        let step = 0

        musicInterval = setInterval(() => {
          if (!isMusicPlaying || !audioCtx) return

          // Bass Ambient Synth
          const oscBass = audioCtx.createOscillator()
          const gainBass = audioCtx.createGain()
          oscBass.type = "triangle"
          oscBass.frequency.setValueAtTime(
            bassNotes[Math.floor(step / 4) % bassNotes.length],
            audioCtx.currentTime,
          )

          gainBass.gain.setValueAtTime(0.08, audioCtx.currentTime)
          gainBass.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.8,
          )

          oscBass.connect(gainBass)
          gainBass.connect(audioCtx.destination)
          oscBass.start()
          oscBass.stop(audioCtx.currentTime + 0.8)

          // Melodi Arpeggio Galaksi Berkelip
          if (step % 2 === 0) {
            const oscLead = audioCtx.createOscillator()
            const gainLead = audioCtx.createGain()
            oscLead.type = "sine"
            const note =
              melodyNotes[Math.floor(Math.random() * melodyNotes.length)]
            oscLead.frequency.setValueAtTime(note, audioCtx.currentTime)

            gainLead.gain.setValueAtTime(0.04, audioCtx.currentTime)
            gainLead.gain.exponentialRampToValueAtTime(
              0.0001,
              audioCtx.currentTime + 0.4,
            )

            oscLead.connect(gainLead)
            gainLead.connect(audioCtx.destination)
            oscLead.start()
            oscLead.stop(audioCtx.currentTime + 0.4)
          }

          step++
        }, 300)
      }

      function stopSpaceSynthLoop() {
        if (musicInterval) {
          clearInterval(musicInterval)
          musicInterval = null
        }
      }

      function toggleMusic() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume()
        }

        isMusicPlaying = !isMusicPlaying
        const btn = document.getElementById("musicToggleBtn")

        if (isMusicPlaying) {
          btn.innerText = "🎵 MUSIC: ON"
          btn.classList.remove("bg-indigo-600", "bg-red-600")
          btn.classList.add("bg-emerald-600")
          startSpaceSynthLoop()
        } else {
          btn.innerText = "🎵 MUSIC: OFF"
          btn.classList.remove("bg-emerald-600", "bg-indigo-600")
          btn.classList.add("bg-red-600")
          stopSpaceSynthLoop()
        }
      }

      function initAutoPlayMusic() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume()
        }
        if (!isMusicPlaying) {
          isMusicPlaying = true
          const btn = document.getElementById("musicToggleBtn")
          if (btn) {
            btn.innerText = "🎵 MUSIC: ON"
            btn.classList.remove("bg-indigo-600", "bg-red-600")
            btn.classList.add("bg-emerald-600")
          }
          startSpaceSynthLoop()
        }
      }

      window.addEventListener("click", initAutoPlayMusic, { once: true })
      window.addEventListener("keydown", initAutoPlayMusic, { once: true })
      window.addEventListener("touchstart", initAutoPlayMusic, { once: true })

      // ==========================================
      // CANVAS & GAMEPLAY LOGIC
      // ==========================================
      const canvas = document.getElementById("galaxyCanvas")
      const ctx = canvas.getContext("2d")

      function resizeCanvas() {
        canvas.width = window.innerWidth
        canvas.height = window.innerHeight
      }
      window.addEventListener("resize", resizeCanvas)
      resizeCanvas()

      let state = "FLYING" // FLYING, LANDING, DOCKED, LAUNCHING
      let targetPlanet = null
      let landProgress = 0

      let player = {
        x: canvas.width / 2 + 200,
        y: canvas.height / 2,
        speed: 4,
        angle: 0,
        scale: 1,
      }

      const stars = []
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 1,
          alpha: Math.random(),
          speed: Math.random() * 0.2 + 0.05,
        })
      }

      const sun = {
        radius: 50,
        rotation: 0,
      }

      const planets = [
        {
          name: "ABOUT",
          orbitRadius: 140, // Disesuaikan agar muat sempurna di layar HP
          angle: 0,
          speed: 0.0015,
          radius: 38,
          color: "#38bdf8",
          darkColor: "#0284c7",
          accentColor: "#e0f2fe",
          hasRing: true,
          rotation: 0,
          desc: "Saya adalah mahasiswa di Teknik Informatika Universitas Pelita Bangsa. Selain itu, saya juga seorang lulusan SMK dengan beberapa pengalaman kerja di industri manufaktur sebagai Aftersales, Quality Control, dan Final Inspection. Pengalaman ini telah mengasah ketelitian dan kemampuan saya dalam menyelesaikan masalah. Saya memiliki passion dalam dunia pemrograman dan berkeinginan untuk berkarir di bidang tersebut.",
        },
        {
          name: "SKILLS",
          orbitRadius: 210,
          angle: Math.PI / 2,
          speed: 0.0012,
          radius: 42,
          color: "#2563eb",
          darkColor: "#1d4ed8",
          accentColor: "#22c55e",
          hasRing: false,
          rotation: 0,
          desc: "Keahlian Utama:\n• Penggunaan Alat Ukur (Caliper, Mikrometer, Dial Gauge, Feeler Gauge)\n• Visual Check & Inspeksi Produk\n• Judgement NG/OK\n• Kerja Tim & Microsoft Office\n• Programming (HTML, CSS, JavaScript, Framework, Java, Python, C++)",
        },
        {
          name: "EXPERIENCE",
          orbitRadius: 280,
          angle: Math.PI,
          speed: 0.0009,
          radius: 48,
          color: "#dc2626",
          darkColor: "#991b1b",
          accentColor: "#f87171",
          hasRing: false,
          rotation: 0,
          desc: "Riwayat Pengalaman Kerja:\n1. Mahasiswa Teknik Informatika di Universitas Pelita Bangsa (Sep 2023 - Sekarang)\n2. Final Inspection di PT. Ichikoh Indonesia (Jun 2023 - Jun 2024): Assembly, Leak Test, SAP.\n3. Quality Control di PT. Yanfeng Automotive Interior Indonesia (Jan 2022 - Jan 2023): Laporan produksi, check fixture.\n4. Aftersales di PT. Senzo Feinmetal (Jan 2020 - Apr 2021): Service rutin unit towing & restorasi.",
        },
        {
          name: "CONTACT",
          orbitRadius: 350, // Diperkecil radius orbitnya agar tidak keluar dari layar HP terkecil sekalipun
          angle: Math.PI * 1.5,
          speed: 0.0006,
          radius: 45,
          color: "#7c3aed",
          darkColor: "#5b21b6",
          accentColor: "#c4b5fd",
          hasRing: true,
          rotation: 0,
          desc: "Hubungi Saya:\n• Email: risalsubekti1507@gmail.com\n• WhatsApp: +62 831-4520-5583\n• Instagram: @risalut15\n• LinkedIn & GitHub tersedia di jaringan profesional.",
        },
      ]

      const keys = {}
      window.addEventListener("keydown", (e) => {
        keys[e.code] = true
        keys[e.key] = true
        if (e.code === "Space" || e.key === " ") {
          e.preventDefault()
          tryLand()
        }
      })
      window.addEventListener("keyup", (e) => {
        keys[e.code] = false
        keys[e.key] = false
      })

      window.addEventListener("click", () => {
        window.focus()
      })

      const bindTouchButton = (id, codes) => {
        const btn = document.getElementById(id)
        if (!btn) return
        const activate = (e) => {
          e.preventDefault()
          codes.forEach((c) => (keys[c] = true))
        }
        const deactivate = (e) => {
          e.preventDefault()
          codes.forEach((c) => (keys[c] = false))
        }
        btn.addEventListener("touchstart", activate, { passive: false })
        btn.addEventListener("touchend", deactivate, { passive: false })
        btn.addEventListener("mousedown", activate)
        btn.addEventListener("mouseup", deactivate)
        btn.addEventListener("mouseleave", deactivate)
      }
      bindTouchButton("btnUp", ["KeyW", "ArrowUp", "w", "W"])
      bindTouchButton("btnLeft", ["KeyA", "ArrowLeft", "a", "A"])
      bindTouchButton("btnDown", ["KeyS", "ArrowDown", "s", "S"])
      bindTouchButton("btnRight", ["KeyD", "ArrowRight", "d", "D"])

      document.getElementById("btnLand").addEventListener("click", tryLand)
      document.getElementById("btnLand").addEventListener("touchend", (e) => {
        e.preventDefault()
        tryLand()
      })
      document.getElementById("launchBtn").addEventListener("click", launchShip)

      function tryLand() {
        if (state !== "FLYING") return
        const sunX = canvas.width / 2
        const sunY = canvas.height / 2
        for (let p of planets) {
          let dist = Math.hypot(player.x - p.x, player.y - p.y)
          if (dist < p.radius + 60) {
            targetPlanet = p
            state = "LANDING"
            landProgress = 0
            break
          }
        }
      }

      function launchShip() {
        state = "LAUNCHING"
        landProgress = 0
        document.getElementById("planetModal").classList.add("hidden")
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)

        const sunX = canvas.width / 2
        const sunY = canvas.height / 2

        const gradient = ctx.createRadialGradient(
          sunX,
          sunY,
          50,
          sunX,
          sunY,
          canvas.width * 0.8,
        )
        gradient.addColorStop(0, "#1a1035")
        gradient.addColorStop(0.5, "#07071a")
        gradient.addColorStop(1, "#020208")
        ctx.fillStyle = gradient
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        stars.forEach((star) => {
          star.alpha += (Math.random() - 0.5) * 0.05
          star.alpha = Math.max(0.1, Math.min(1, star.alpha))
          star.y -= star.speed
          if (star.y < 0) star.y = canvas.height

          ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`
          ctx.fillRect(star.x, star.y, star.size, star.size)
        })

        planets.forEach((p) => {
          ctx.strokeStyle = "rgba(99, 102, 241, 0.15)"
          ctx.lineWidth = 1
          ctx.beginPath()
          ctx.arc(sunX, sunY, p.orbitRadius, 0, Math.PI * 2)
          ctx.stroke()
        })

        sun.rotation += 0.02
        ctx.save()
        ctx.translate(sunX, sunY)
        ctx.rotate(sun.rotation)
        ctx.fillStyle = "#f59e0b"
        ctx.beginPath()
        ctx.arc(0, 0, sun.radius, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = "#ef4444"
        ctx.fillRect(
          -sun.radius * 0.5,
          -sun.radius * 0.5,
          sun.radius * 0.3,
          sun.radius * 0.3,
        )
        ctx.fillStyle = "#fde047"
        ctx.fillRect(
          -sun.radius * 0.2,
          -sun.radius * 0.2,
          sun.radius * 0.4,
          sun.radius * 0.4,
        )
        ctx.restore()

        ctx.fillStyle = "#fde047"
        ctx.font = '8px "Press Start 2P"'
        ctx.textAlign = "center"
        ctx.fillText("SOLAR SYSTEM", sunX, sunY + sun.radius + 16)

        planets.forEach((p) => {
          let isTarget = targetPlanet === p
          let isDockedOrLanding = state === "LANDING" || state === "DOCKED"

          if (state === "FLYING") {
            p.angle += p.speed
            p.x = sunX + Math.cos(p.angle) * p.orbitRadius
            p.y = sunY + Math.sin(p.angle) * p.orbitRadius
            p.rotation += 0.01
          }

          ctx.save()

          if (isDockedOrLanding && isTarget) {
            const targetX = Math.min(canvas.width - 150, canvas.width * 0.75)
            const targetY = Math.min(canvas.height - 180, canvas.height * 0.7)

            p.x += (targetX - p.x) * 0.1
            p.y += (targetY - p.y) * 0.1
            p.scale = (p.scale || 1) + (4.0 - (p.scale || 1)) * 0.1
            ctx.globalAlpha = 1.0
          } else if (isDockedOrLanding && !isTarget) {
            ctx.globalAlpha = 0.2
            p.scale = (p.scale || 1) + (0.5 - (p.scale || 1)) * 0.1
          } else {
            ctx.globalAlpha = 1.0
            p.scale = (p.scale || 1) + (1 - (p.scale || 1)) * 0.1
          }

          ctx.translate(p.x, p.y)
          ctx.scale(p.scale, p.scale)

          if (p.hasRing) {
            ctx.save()
            ctx.rotate(0.3)
            ctx.strokeStyle = p.accentColor
            ctx.lineWidth = 4
            ctx.beginPath()
            ctx.ellipse(0, 0, p.radius * 1.5, p.radius * 0.5, 0, 0, Math.PI * 2)
            ctx.stroke()
            ctx.restore()
          }

          ctx.rotate(p.rotation)

          ctx.fillStyle = p.color
          ctx.beginPath()
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2)
          ctx.fill()

          ctx.fillStyle = p.darkColor
          ctx.fillRect(-p.radius * 0.4, -p.radius * 0.3, 16, 12)

          ctx.fillStyle = p.accentColor
          ctx.fillRect(-p.radius * 0.1, p.radius * 0.4, 14, 10)

          ctx.restore()

          if (state === "FLYING" || targetPlanet !== p) {
            ctx.save()
            ctx.globalAlpha = isDockedOrLanding ? 0.2 : 1.0
            ctx.fillStyle = "#ffffff"
            ctx.font = '9px "Press Start 2P"'
            ctx.textAlign = "center"
            ctx.fillText(p.name, p.x, p.y - p.radius * (p.scale || 1) - 10)

            let dist = Math.hypot(player.x - p.x, player.y - p.y)
            if (dist < p.radius + 60 && state === "FLYING") {
              ctx.fillStyle = "#facc15"
              ctx.font = '7px "Press Start 2P"'
              ctx.fillText("PRESS SPACE TO LAND", p.x, p.y + p.radius + 18)
            }
            ctx.restore()
          }
        })

        if (state === "FLYING") {
          let dx = 0,
            dy = 0
          if (keys["ArrowUp"] || keys["KeyW"] || keys["w"] || keys["W"]) dy -= 1
          if (keys["ArrowDown"] || keys["KeyS"] || keys["s"] || keys["S"])
            dy += 1
          if (keys["ArrowLeft"] || keys["KeyA"] || keys["a"] || keys["A"])
            dx -= 1
          if (keys["ArrowRight"] || keys["KeyD"] || keys["d"] || keys["D"])
            dx += 1

          if (dx !== 0 || dy !== 0) {
            let angleTarget = Math.atan2(dy, dx) + Math.PI / 2
            player.angle = angleTarget
            player.x += dx * player.speed
            player.y += dy * player.speed
          }

          player.x = Math.max(20, Math.min(canvas.width - 20, player.x))
          player.y = Math.max(20, Math.min(canvas.height - 20, player.y))
          player.scale = 1
        } else if (state === "LANDING") {
          const targetX = Math.min(canvas.width - 150, canvas.width * 0.75)
          const targetY =
            Math.min(canvas.height - 180, canvas.height * 0.7) -
            targetPlanet.radius * 4.0 -
            2

          player.x += (targetX - player.x) * 0.15
          player.y += (targetY - player.y) * 0.15
          player.angle += (0 - player.angle) * 0.15
          player.scale += (1.5 - player.scale) * 0.15

          landProgress += 0.05
          if (landProgress >= 1) {
            state = "DOCKED"
            player.x = targetX
            player.y = targetY

            document.getElementById("modalTitle").innerText =
              "PLANET: " + targetPlanet.name
            document.getElementById("modalDesc").innerText = targetPlanet.desc

            const avatarContainer = document.getElementById(
              "astronautAvatarContainer",
            )
            if (targetPlanet.name === "ABOUT") {
              avatarContainer.classList.remove("hidden")
            } else {
              avatarContainer.classList.add("hidden")
            }

            document.getElementById("planetModal").classList.remove("hidden")
          }
        } else if (state === "DOCKED") {
          const targetX = Math.min(canvas.width - 150, canvas.width * 0.75)
          const targetY =
            Math.min(canvas.height - 180, canvas.height * 0.7) -
            targetPlanet.radius * 4.0 -
            2
          player.x = targetX
          player.y = targetY
          player.angle = 0
          player.scale = 1.5
        } else if (state === "LAUNCHING") {
          player.y -= 6
          player.scale -= 0.02
          if (player.y < canvas.height / 2) {
            state = "FLYING"
            targetPlanet = null
          }
        }

        ctx.save()
        ctx.translate(player.x, player.y)
        ctx.rotate(player.angle)
        ctx.scale(player.scale, player.scale)

        ctx.fillStyle = "#38bdf8"
        ctx.fillRect(-6, -12, 12, 24)
        ctx.fillStyle = "#ef4444"
        ctx.fillRect(-4, -18, 8, 6)
        ctx.fillStyle = "#fef08a"
        ctx.fillRect(-2, -6, 4, 6)
        ctx.fillStyle = "#cbd5e1"
        ctx.fillRect(-12, 2, 6, 10)
        ctx.fillRect(6, 2, 6, 10)

        ctx.fillStyle = "#f97316"
        ctx.fillRect(-4, 12, 8, Math.random() * 10 + 8)
        ctx.fillStyle = "#facc15"
        ctx.fillRect(-2, 12, 4, Math.random() * 6 + 4)

        ctx.restore()

        requestAnimationFrame(animate)
      }

      window.onload = function () {
        animate()
        setTimeout(initAutoPlayMusic, 500)
      }
    </script>
  </body>
</html>
